spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school_fees}
    username: ${DB_USERNAME:school}
    password: ${DB_PASSWORD:school_dev_password}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none