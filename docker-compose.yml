services:
  postgres:
    build:
      context: .
      dockerfile: src/main/resources/db/migration/Dockerfile
    environment:
      POSTGRES_DB: school_fees
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:

